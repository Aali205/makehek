<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E2007C" />
  <link rel="icon" type="image/svg+xml" href="./logo-mark.svg" />
  <meta property="og:title" content="Make Hek Dresses" />
  <meta property="og:description" content="Luxury evening dresses for rent & sale · Malki, Damascus" />
  <meta property="og:image" content="./logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap"
    rel="stylesheet" />

  <title>المتجر · Make Hek Dresses</title>
  <script type="module" crossorigin src="./assets/main-D3MfLTot.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-CoxGDbAy.css">
</head>
<body data-page="shop">
<!-- Announcement -->
<div class="announce" aria-label="announcements">
  <div class="announce__track">
    <span data-i18n="announce1"></span><i>✦</i>
    <span data-i18n="announce2"></span><i>✦</i>
    <span data-i18n="announce3"></span><i>✦</i>
    <span data-i18n="announce1"></span><i>✦</i>
    <span data-i18n="announce2"></span><i>✦</i>
    <span data-i18n="announce3"></span><i>✦</i>
  </div>
</div>

<!-- Header -->
<header class="header" id="top">
  <div class="container header__inner">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>

    <a href="./" class="brand" aria-label="Make Hek Dresses">
      <img src="./logo-mark.svg" alt="" class="brand__mark" width="30" height="56" />
      <span class="brand__text">
        <span class="brand__name">Make Hek</span>
        <span class="brand__sub">Dresses</span>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a href="./" data-nav="home" data-i18n="navHome"></a>
      <a href="./collections.html" data-nav="collections" data-i18n="navCollections"></a>
      <a href="./shop.html" data-nav="shop" data-i18n="navShop"></a>
      <a href="./showroom.html" data-nav="showroom">360°</a>
      <a href="./lookbook.html" data-nav="lookbook" data-i18n="navLookbook"></a>
      <a href="./rent.html" data-nav="rent" data-i18n="navRent"></a>
      <a href="./contact.html" data-nav="contact" data-i18n="navContact"></a>
      <a href="./my-orders.html" data-nav="orders" data-i18n="navOrders"></a>
    </nav>

    <div class="header__actions">
      <button class="lang-btn" id="langBtn" aria-label="Language">EN</button>
      <a class="icon-btn" href="./favorites.html" data-nav="favorites" aria-label="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span class="badge" id="favCount">0</span>
      </a>
      <a class="icon-btn bag-btn" href="./cart.html" data-nav="cart" aria-label="Bag">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="badge" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>


<main>
  <section class="page-hero">
    <div class="page-hero__deco" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="container">
      <nav class="crumbs" aria-label="breadcrumb"><a href="./" data-i18n="navHome"></a><i>›</i><span data-i18n="navShop"></span></nav>
      <p class="eyebrow" data-i18n="shopEyebrow"></p>
      <h1 class="page-hero__title" data-i18n="shopTitle"></h1>
      <p class="page-hero__lead" data-i18n="shopLead"></p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="toolbar">
        <div class="chips" id="filterChips" role="tablist"></div>
        <div class="toolbar__right">
          <div class="seg" id="modeSeg">
            <button data-mode="all" class="is-active" data-i18n="modeAll"></button>
            <button data-mode="rent" data-i18n="modeRent"></button>
            <button data-mode="buy" data-i18n="modeBuy"></button>
          </div>
          <div class="dd" id="sortDD">
            <button class="dd__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Sort">
              <svg viewBox="0 0 24 24" class="dd__icon"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
              <span class="dd__label"></span>
              <svg viewBox="0 0 24 24" class="dd__chev"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <ul class="dd__menu" role="listbox" tabindex="-1">
              <li role="option" data-value="featured"><span data-i18n="sortFeatured"></span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></li>
              <li role="option" data-value="low"><span data-i18n="sortLow"></span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></li>
              <li role="option" data-value="high"><span data-i18n="sortHigh"></span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></li>
            </ul>
          </div>
        </div>
      </div>

      <p class="result-count" id="resultCount"></p>
      <div class="grid" id="productGrid"></div>
      <div class="empty" id="emptyMsg" hidden>
        <img src="./logo-mark.svg" alt="" />
        <p data-i18n="empty"></p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer__grid">
    <div class="footer__brand">
      <img src="./logo.svg" alt="Make Hek Dresses" class="footer__logo" width="96" height="222" />
      <p class="footer__tag script" data-i18n="footerTag"></p>
    </div>
    <div class="footer__col">
      <h4 data-i18n="footShop"></h4>
      <a href="./shop.html" data-i18n="navShop"></a>
      <a href="./collections.html" data-i18n="navCollections"></a>
      <a href="./showroom.html">360°</a>
      <a href="./lookbook.html" data-i18n="navLookbook"></a>
      <a href="./favorites.html" data-i18n="navFavorites"></a>
    </div>
    <div class="footer__col">
      <h4 data-i18n="footHelp"></h4>
      <a href="./rent.html" data-i18n="navRent"></a>
      <a href="./cart.html" data-i18n="navBag"></a>
      <a href="./my-orders.html" data-i18n="navOrders"></a>
      <a href="./contact.html" data-i18n="navContact"></a>
    </div>
    <div class="footer__col">
      <h4 data-i18n="footVisit"></h4>
      <p data-i18n="address"></p>
      <p data-i18n="hours"></p>
      <a href="tel:+963944084832" dir="ltr">+963 944 084 832</a>
      <div class="footer__social">
        <a href="https://www.instagram.com/makehek_dresses/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a data-wa target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/></svg>
        </a>
      </div>
    </div>
  </div>
  <p class="footer__copy">© <span id="year"></span> Make Hek Dresses · <span data-i18n="rights"></span></p>
</footer>

<!-- Quick view -->
<div class="modal" id="quickView" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="qvName">
    <button class="icon-btn modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="qv">
      <div class="qv__media">
        <img id="qvImg" alt="" />
        <div class="qv__thumbs" id="qvThumbs"></div>
      </div>
      <div class="qv__info">
        <p class="eyebrow" id="qvTag"></p>
        <h3 class="qv__name" id="qvName"></h3>
        <p class="qv__desc" id="qvDesc"></p>

        <p class="label" data-i18n="chooseMode"></p>
        <div class="mode-cards" id="qvModes"></div>

        <div id="qvDateWrap">
          <label class="label" for="qvDate" data-i18n="eventDate"></label>
          <input type="date" id="qvDate" class="input" />
        </div>

        <p class="label" data-i18n="chooseSize"></p>
        <div class="sizes" id="qvSizes"></div>

        <button class="btn btn--primary btn--block" id="qvAdd" data-i18n="addToBag"></button>
        <p class="qv__note" data-i18n="qvNote"></p>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lb__close" data-lb="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="icon-btn lb__nav lb__prev" data-lb="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <img id="lbImg" alt="" />
  <button class="icon-btn lb__nav lb__next" data-lb="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <p class="lb__count" id="lbCount"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<a class="wa-float" data-wa target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/><path d="M9 9.5c.3 2 2.5 4.2 4.5 4.5l1-1 1.5.7c-.2 1-1 1.6-2 1.6A6 6 0 0 1 8 9.3c0-1 .6-1.8 1.6-2l.7 1.5-1 .7z"/></svg>
</a>


</body>
</html>
