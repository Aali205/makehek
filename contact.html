<main>
  <section class="page-hero">
    <div class="page-hero__deco" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="container">
      <nav class="crumbs" aria-label="breadcrumb"><a href="./" data-i18n="navHome"></a><i>›</i><span data-i18n="navContact"></span></nav>
      <p class="eyebrow" data-i18n="visitEyebrow"></p>
      <h1 class="page-hero__title" data-i18n="contactTitle"></h1>
      <p class="page-hero__lead" data-i18n="contactLead"></p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container contact">
      <div class="contact__info">
        <div class="visit__card">
          <h2 class="section__title" data-i18n="visitTitle"></h2>
        <ul class="visit__list">
          <li>
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span data-i18n="address"></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span data-i18n="hours"></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" class="ic"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            <a href="tel:+963944084832" dir="ltr">+963 944 084 832</a>
          </li>
        </ul>
          <div class="hero__cta">
            <a class="btn btn--ghost" target="_blank" rel="noopener" href="https://maps.google.com/?q=Malki+Albezem+Avenue+Damascus" data-i18n="directions"></a>
            <a class="btn btn--ghost" target="_blank" rel="noopener" href="https://www.instagram.com/makehek_dresses/">Instagram</a>
          </div>
        </div>
        <div class="visit__map">
          <iframe title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  src="https://www.google.com/maps?q=Al+Malki+Damascus+Syria&z=15&output=embed"></iframe>
        </div>
      </div>
      <form class="contact__form" id="contactForm">
        <h2 class="section__title" data-i18n="formTitle"></h2>
        <p class="muted" data-i18n="formLead"></p>
        <p class="label" data-i18n="formTopic"></p>
        <div class="chips" id="topicChips"></div>
        <label class="label" for="cName" data-i18n="yourName"></label>
        <input class="input" id="cName" name="name" required />
        <label class="label" for="cPhone" data-i18n="yourPhone"></label>
        <input class="input" id="cPhone" name="phone" type="tel" dir="ltr" required />
        <label class="label" for="cDate" data-i18n="eventDateOpt"></label>
        <input class="input" id="cDate" name="date" type="date" />
        <label class="label" for="cMsg" data-i18n="formMsg"></label>
        <textarea class="input" id="cMsg" name="message" rows="4" required></textarea>
        <button class="btn btn--primary btn--block" type="submit">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/></svg>
          <span data-i18n="formSend"></span>
        </button>
      </form>
    </div>
  </section>
